{% extends 'base.html' %}

{% block title %}{% if book %}Edit Book{% else %}Add Book{% endif %}{% endblock %}

{% block content %}
    <h2>{% if book %}Edit Book{% else %}Add Book{% endif %}</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <input type="text" name="name" placeholder="Book Name" required>
        <input type="text" name="title" placeholder="Book Title"required>
        <textarea name="caption" placeholder="Book Description" required></textarea>
        <input type="date" name="due_date" required>
        <input type="number" name="quantity" placeholder="Quantity" min="1"required>
        <input type="file" name="picture" accept="image/*">
        <button type="submit">Save</button>
    </form>
{% endblock %}
